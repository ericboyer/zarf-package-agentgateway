# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: agentgateway
  description: "UDS Agentgateway Package"
  version: "dev"

variables:
  - name: DOMAIN
    default: "uds.dev"

components:
  - name: agentgateway
    required: true
    description: "Deploy Upstream Agentgateway"
    import:
      path: common
    only:
      flavor: upstream
    charts:
      - name: agentgateway
        valuesFiles:
          - values/upstream-values.yaml
    images:
      - cr.agentgateway.dev/controller:v1.2.1
      - cr.agentgateway.dev/agentgateway:v1.2.1
