domain: "###ZARF_VAR_DOMAIN###"

monitoring:
  enabled: false

# Configuration for the data-plane Gateway resource that exposes admin UI + MCP.
# The agentgateway controller creates a Deployment + Service when it sees a
# Gateway referencing the `agentgateway` GatewayClass; the Service name matches
# the Gateway name and lives in the same namespace.
gateway:
  enabled: true
  name: agentgateway-proxy
  className: agentgateway
  podLabelKey: gateway.networking.k8s.io/gateway-name
  http:
    enabled: true
    name: http
    port: 80
    allowedRoutesFrom: Same

# Admin UI is served on the proxy pods on port 15000 and is NOT exposed as a
# Service by the controller — this chart creates one so it can be routed via
# the UDS admin gateway. Disable to skip the Service + expose rule entirely.
admin:
  enabled: true
  host: agentgateway
  port: 15000

# MCP endpoint goes through the controller-managed `agentgateway-proxy` Service.
# `port` should match a listener configured on the Gateway above.
mcp:
  enabled: true
  host: agentgateway-mcp
  port: 80

# Keycloak / OIDC integration for the MCP gateway.
# When enabled this provisions a UDS-managed Keycloak client and attaches an
# AgentgatewayPolicy that requires a valid Keycloak-issued JWT on traffic
# through the data-plane Gateway (admin UI is unaffected).
keycloak:
  enabled: true

  # UDS Keycloak realm + hostname (UDS Core default is sso.<domain>/realms/uds).
  realm: uds
  ssoHost: sso

  # Keycloak client provisioned for this gateway. The agentgateway uses
  # `clientId` as the expected JWT `aud` value; the Secret stored under
  # `secretName` is available to any caller that needs client credentials.
  clientId: agentgateway-mcp
  secretName: agentgateway-mcp-sso

  # JWT `aud` values the policy accepts. Keep clientId in the list so tokens
  # minted with this client's audience pass; add additional client IDs as
  # other apps start calling the gateway.
  audiences:
    - agentgateway-mcp

  # In-cluster Keycloak Service the proxy uses to fetch JWKS keys. UDS Core
  # ships Keycloak as `keycloak.keycloak.svc.cluster.local:8080`.
  service:
    name: keycloak
    namespace: keycloak
    port: 8080
  jwksPath: /protocol/openid-connect/certs

  # MCP OAuth resource metadata advertised at .well-known. Empty string for
  # `resource` falls back to the public mcp.host URL.
  mcp:
    resource: ""
    scopesSupported:
      - openid
      - email
      - profile
    bearerMethodsSupported:
      - header

additionalNetworkAllow: []
