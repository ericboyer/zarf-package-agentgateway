kind: UDSBundle
metadata:
  name: agentgateway-test
  description: A UDS bundle for deploying Agentgateway on a development cluster
  version: dev

packages:
  - name: agentgateway
    path: ../
    ref: dev
    flavor: upstream
    overrides:
      agentgateway:
        uds-agentgateway-config:
          values:
            - path: monitoring.enabled
              value: false
            # Flip to true to enable Keycloak JWT enforcement on the MCP gateway.
            # Provisions a Keycloak client (agentgateway-mcp) and attaches an
            # AgentgatewayPolicy that requires a valid JWT from sso.<domain>.
            - path: keycloak.enabled
              value: false
